name: smoke-web

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push novo no MESMO PR cancela o smoke velho: ele testaria um commit que já não é
# a cabeça do PR e prende runner do plano Free (teto de 20 jobs) por até 40 min.
concurrency:
  group: smoke-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # O FILTRO. Era o `paths:` do `on:`, que deixou 13 PRs de jogo sem smoke em 48 h
  # (lista por arquivo que ninguém atualizava), não deixava check quando não casava e
  # o GitHub ignora em PR com mais de 300 arquivos. Agora o padrão mora em
  # scripts/ci/gatilho.mjs (fonte única, medida pela eval:portaogatilho) e o pulo
  # aparece como SKIPPED, que o check_automerge aceita. Falha FECHADO: push, dispatch,
  # erro de diff ou do gatilho = roda. Só `rodar=false` exato pula.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.filtro.outputs.rodar }}
    steps:
      # Leve: só árvore e commits; os blobs vêm sob demanda (o package.json, se mudou).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
      - name: O PR toca o que smoke mede?
        id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" != "pull_request" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "$EVENTO: roda sempre"; exit 0
          fi
          # -z e quotePath=false: nome com acento sai cru, não entre aspas em octal (que
          # não casaria com nada e pularia o job). A lista vai separada por NUL.
          if ! git -c core.quotePath=false diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/arquivos.txt"; then
            echo "::warning::git diff falhou: sem saber o que mudou, smoke roda"
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$(tr -cd '\0' < "$RUNNER_TEMP/arquivos.txt" | wc -c) arquivo(s) no diff"
          node scripts/ci/gatilho.mjs smoke < "$RUNNER_TEMP/arquivos.txt" > "$RUNNER_TEMP/veredito.txt" \
            || echo "rodar=true" > "$RUNNER_TEMP/veredito.txt"
          if grep -qx 'rodar=false' "$RUNNER_TEMP/veredito.txt"; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: decide
    if: needs.decide.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4321 >/tmp/csbrasil-dev.log 2>&1 &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/csbrasil-dev.log
          exit 1
      - name: Run smoke test
        run: npx playwright test --config=playwright.smoke.config.mjs tests/smoke/web-smoke.spec.js tests/smoke/web-assets.spec.js tests/smoke/chat-sala.spec.js --reporter=list --trace=on --output=test-results
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-web-artifacts
          path: |
            /tmp/csbrasil-dev.log
            test-results
          if-no-files-found: ignore
